services:
  # Backend API Web Service
  - type: web
    name: curricraft-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: curricraft-production-secret-key-2026-super-secure
      - key: JWT_REFRESH_SECRET
        value: curricraft-production-refresh-secret-key-2026

  # Frontend Static Web Site
  - type: web
    name: curricraft-portal
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
